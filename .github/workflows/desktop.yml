# Builds the Raazdar desktop apps (Windows, macOS, Linux) and publishes them as a release.
# The apps are a locked-down window onto https://quietline.chat/app with screenshot blocking.
# They are not code-signed yet, so Windows SmartScreen and macOS Gatekeeper will warn on first open.
# Each platform publishes into the same release as soon as it is built (macOS machines are sometimes busy).
name: Build desktop apps
on:
  workflow_dispatch:
  push:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, files: "desktop/dist/*.exe" }
          - { os: macos-latest, name: mac, files: "desktop/dist/*.dmg" }
          - { os: ubuntu-latest, name: linux, files: "desktop/dist/*.AppImage\ndesktop/dist/*.deb" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --publish never
          cd dist
          shopt -s nullglob
          for f in *.exe *.dmg *.AppImage *.deb; do if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi; done > SHA256SUMS-${{ matrix.name }}.txt
          cat SHA256SUMS-${{ matrix.name }}.txt
      - name: Release notes
        shell: bash
        run: |
          cat > notes.md <<'NOTES'
          ### Raazdar for desktop
          - **Windows:** the Setup .exe installs it; the portable .exe runs without installing. If SmartScreen warns, choose *More info → Run anyway*.
          - **Mac:** open the .dmg and drag Raazdar to Applications. The first time, right-click the app and choose *Open* (it isn't Apple-notarised yet).
          - **Linux:** the .AppImage runs anywhere (make it executable); the .deb installs on Ubuntu/Debian.

          Check your download against the SHA256SUMS file for your system.
          NOTES
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          name: Raazdar Desktop ${{ github.run_number }}
          body_path: notes.md
          make_latest: false
          files: |
            ${{ matrix.files }}
            desktop/dist/SHA256SUMS-${{ matrix.name }}.txt
