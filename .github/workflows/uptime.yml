# Checks every 30 minutes that raazdar.app is up. If it's down, the run fails and GitHub emails the
# repository owner. The check sees only {"ok":true}: nothing about users.
name: Uptime check
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: raazdar.app is up
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://raazdar.app/healthz) && [ "$code" = 200 ] && { echo "up ($code)"; exit 0; }
            sleep 20
          done
          echo "::error::raazdar.app/healthz returned $code"; exit 1
      - name: Certificate valid for more than 14 days
        run: |
          end=$(echo | openssl s_client -servername raazdar.app -connect raazdar.app:443 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          left=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          echo "certificate expires in $left days"; [ "$left" -gt 14 ]
