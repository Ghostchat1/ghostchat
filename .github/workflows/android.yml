# Builds the GhostChat Android app (APK) in the cloud — no Android Studio needed.
# Push this project to a GitHub repo, open the "Actions" tab, run "Build Android APK",
# and download the APK from the finished run's "Artifacts".
#
# Optional (recommended before sharing the app): add your own signing key as repo secrets
#   GC_KEYSTORE_B64 (base64 of your .jks file), GC_KEYSTORE_PASS, GC_KEY_ALIAS, GC_KEY_PASS
# so every future version installs over the previous one.
name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ["public/**", "android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use the runner's Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Load signing key (if provided)
        env:
          KS: ${{ secrets.GC_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/gc.jks"; echo "GC_KEYSTORE=$RUNNER_TEMP/gc.jks" >> "$GITHUB_ENV"; fi
      - name: Build release APK
        env:
          GC_KEYSTORE_PASS: ${{ secrets.GC_KEYSTORE_PASS }}
          GC_KEY_ALIAS: ${{ secrets.GC_KEY_ALIAS }}
          GC_KEY_PASS: ${{ secrets.GC_KEY_PASS }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GhostChat-APK
          path: android/app/build/outputs/apk/release/*.apk
