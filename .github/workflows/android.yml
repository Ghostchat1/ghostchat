# Builds the Raazdar Android app (APK) in the cloud and publishes it as a release.
# Official releases are signed with Raazdar's permanent key (android/gc-release.p12, itself locked
# with a strong password kept only in the GC_KEYSTORE_PASS repository secret), so every update
# installs over the previous one and anyone can verify the app is genuine.
name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ["public/**", "android/**", ".github/workflows/android.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use the runner's Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Check for the signing password
        id: sign
        env:
          PW: ${{ secrets.GC_KEYSTORE_PASS }}
        run: if [ -n "$PW" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::warning::GC_KEYSTORE_PASS secret is missing, so this build is NOT published as an official release."; fi
      - name: Build release APK
        env:
          GC_KEYSTORE: ${{ steps.sign.outputs.ok == 'true' && format('{0}/android/gc-release.p12', github.workspace) || '' }}
          GC_KEYSTORE_PASS: ${{ secrets.GC_KEYSTORE_PASS }}
          GC_KEY_ALIAS: ghostchat
          GC_KEY_PASS: ${{ secrets.GC_KEYSTORE_PASS }}
        run: |
          if [ -z "$GC_KEYSTORE" ]; then unset GC_KEYSTORE; fi
          gradle -p android assembleRelease bundleRelease --no-daemon --stacktrace
      - name: Checksum and signing certificate
        if: steps.sign.outputs.ok == 'true'
        run: |
          cp android/app/build/outputs/apk/release/*.apk Raazdar.apk
          cp android/app/build/outputs/bundle/release/*.aab Raazdar-playstore.aab
          sha256sum Raazdar-playstore.aab > Raazdar-playstore.aab.sha256
          SHA=$(sha256sum Raazdar.apk | cut -d' ' -f1)
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          CERT=$("$BT/apksigner" verify --print-certs Raazdar.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "$SHA  Raazdar.apk" > Raazdar.apk.sha256
          {
            echo "### Raazdar for Android"
            echo ""
            echo "Download **Raazdar.apk** below and open it on your Android phone (allow \"install unknown apps\" when asked)."
            echo ""
            echo "**Verify your download**"
            echo "- SHA-256 of Raazdar.apk: \`$SHA\`"
            echo "- Signing certificate SHA-256: \`$CERT\`"
            echo "- Official certificate (also on raazdar.app/download): \`7d9f644732769be571c2a06315168a844eca6434ca54777b2863cc51d11360cf\`"
            echo ""
            echo "_Raazdar-playstore.aab is the same app packaged for upload to Google Play. You don't need it on a phone._"
          } > notes.md
          echo "CERT=$CERT" >> "$GITHUB_ENV"
      - name: Refuse to publish if the certificate is not the official one
        if: steps.sign.outputs.ok == 'true'
        run: test "$CERT" = "7d9f644732769be571c2a06315168a844eca6434ca54777b2863cc51d11360cf"
      - uses: softprops/action-gh-release@v3
        if: steps.sign.outputs.ok == 'true'
        with:
          tag_name: apk-${{ github.run_number }}
          name: Raazdar Android ${{ github.run_number }}
          body_path: notes.md
          files: |
            Raazdar.apk
            Raazdar.apk.sha256
            Raazdar-playstore.aab
            Raazdar-playstore.aab.sha256
          make_latest: true
