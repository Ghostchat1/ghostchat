# Weekly checks for security updates in everything Raazdar depends on.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: "/desktop"
    schedule: { interval: weekly }
  - package-ecosystem: gradle
    directory: "/android"
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
